<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - Pukhtoon Education</title>
<link rel="icon" type="image/png" href="favicon.png">
<script>document.documentElement.classList.add('js');</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Segoe UI", Arial, Helvetica, sans-serif; color:#16181D; background:#D8DCDF; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:30px 16px; }
  a { text-decoration:none; color:inherit; }
  .card { background:#fff; border-radius:16px; box-shadow:0 18px 46px rgba(20,24,30,.18); width:100%; max-width:472px; padding:42px 44px 38px; }
  .logo { text-align:center; margin-bottom:26px; }
  .logo img { height:168px; width:auto; }
  .tabs { display:flex; border-bottom:1.6px solid #E1E5E8; margin-bottom:26px; }
  .tabs a { flex:1; text-align:center; font-size:21px; font-weight:800; letter-spacing:.6px; padding:12px 0; color:#9AA1A8; }
  .tabs a.active { color:#16181D; border-bottom:4px solid #E2231A; margin-bottom:-1.6px; }
  .btn-google { display:flex; align-items:center; justify-content:center; gap:13px; width:100%; background:#fff; border:1.6px solid #C4C9CD; border-radius:9px; padding:13px 16px; font-size:18.5px; font-weight:700; color:#2A2E33; transition:border-color .2s ease, box-shadow .2s ease, transform .25s ease; }
  .btn-google:hover { border-color:#9AA1A8; box-shadow:0 8px 18px rgba(20,24,30,.12); transform:translateY(-2px); }
  .g-mark { width:30px; height:30px; flex:0 0 30px; border-radius:50%; border:1.6px solid #E1E5E8; display:flex; align-items:center; justify-content:center; font-family:Arial, Helvetica, sans-serif; font-size:19px; font-weight:700; color:#4285F4; background:#fff; }
  .divider { display:flex; align-items:center; gap:14px; margin:22px 0 24px; color:#8A9096; font-size:15.5px; font-weight:600; }
  .divider::before, .divider::after { content:""; flex:1; border-top:1.4px solid #E1E5E8; }
  html.js .auth-panel { display:none; }
  html.js .auth-panel.on { display:block; }
  label.field-label { display:block; font-size:17.5px; font-weight:600; margin-bottom:9px; }
  .pass-row { display:flex; justify-content:space-between; align-items:baseline; }
  .forgot { color:#C0272D; font-size:16.5px; font-weight:600; }
  .input-wrap { position:relative; margin-bottom:22px; }
  input[type=email], input[type=password], input[type=text] { width:100%; border:1.6px solid #C4C9CD; border-radius:8px; padding:15px 16px; font-size:17px; outline:none; color:#16181D; background:#fff; font-family:inherit; }
  input:focus { border-color:#E2231A; }
  .eye { position:absolute; right:14px; top:50%; transform:translateY(-50%); }
  .remember { display:flex; align-items:center; gap:11px; font-size:17px; margin:2px 0 24px; cursor:pointer; }
  .remember input { width:21px; height:21px; accent-color:#E2231A; }
  .btn-login { display:block; width:100%; background:#E2231A; color:#fff; font-size:20px; font-weight:800; letter-spacing:.8px; text-align:center; padding:16px; border-radius:9px; border:none; cursor:pointer; font-family:inherit; transition:transform .25s ease, box-shadow .25s ease, background .25s ease; }
  .btn-login:hover { background:#C41B14; transform:translateY(-2px); box-shadow:0 10px 22px rgba(20,24,30,.2); }
  @keyframes riseIn { from { transform:translateY(20px); opacity:.85; } to { transform:translateY(0); opacity:1; } }
  .card { animation:riseIn .7s ease both; }
  input[type=email], input[type=password], input[type=text] { transition:border-color .2s ease, box-shadow .2s ease; }
  input:focus { box-shadow:0 0 0 3px rgba(226,35,26,.15); }
  .signup-line { text-align:center; font-size:17.5px; margin-top:24px; }
  .signup-line a { color:#C0272D; font-weight:700; }
  .home-link { display:block; text-align:center; margin-top:18px; font-size:15.5px; color:#5A6067; }
  @media (max-width:520px){
    .card { padding:30px 22px 28px; }
    .logo img { height:134px; }
    .tabs a { font-size:18px; }
    .btn-google { font-size:16.5px; }
  }

  /* Scroll reveal (safe): start state applies only when JS runs; script force-reveals all after 1.5s */
  html.js .rv { opacity:.85; transform:translateY(18px); transition:opacity .6s ease, transform .6s ease; }
  html.js .rv.in { opacity:1; transform:none; }
  html.js .rv .band-track i { transform:scaleX(0); transform-origin:left center; transition:transform 1.1s ease .15s; }
  html.js .rv.in .band-track i { transform:scaleX(1); }
  body { overflow-x:clip; }

  /* Design polish pass: typography, cards, buttons, tables */
  body { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  h1 { letter-spacing:-.02em; line-height:1.12; }
  h2 { letter-spacing:-.01em; line-height:1.22; }
  .card { border-color:#DDE2E6; border-radius:16px; box-shadow:0 10px 30px rgba(20,24,30,.07); }
  .btn { border-radius:10px; letter-spacing:.01em; }
  .btn:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid rgba(226,35,26,.35); outline-offset:2px; }
  ::selection { background:#F9D2D2; }
  table { font-variant-numeric:tabular-nums; }
  table th { background:#F7F8F9; }
  table tr:hover td { background:#FFF7F7; }

  /* Design polish pass: standalone cards */
  .card { box-shadow:0 24px 60px rgba(20,24,30,.20); }
</style>
</head>
<body>

<div class="card rv">
  <div class="logo"><a href="index.html"><img src="logo.jpg" alt="Pukhtoon Education"></a></div>

  <div class="tabs">
    <a href="#login" class="active" id="tabLogin">LOG IN</a>
    <a href="#signup" id="tabSignup">SIGN UP</a>
  </div>

  <a class="btn-google" href="onboarding.html"><span class="g-mark">G</span> Continue with Google</a>
  <div class="divider">or use your email</div>

  <div class="auth-panel on" id="login">
    <form action="dashboard.html" method="get">
      <label class="field-label" for="email">Email Address</label>
      <div class="input-wrap">
        <input type="email" id="email" placeholder="Enter your email">
      </div>

      <div class="pass-row">
        <label class="field-label" for="password">Password</label>
        <a class="forgot" href="login.html">forgot?</a>
      </div>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="••••••••">
        <svg class="eye" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9AA1A8" stroke-width="1.9"><path d="M3 12s3.5-6 9-6c2 0 3.7.8 5.1 1.9M21 12s-3.5 6-9 6c-2 0-3.7-.8-5.1-1.9"/><path d="M4 4l16 16"/></svg>
      </div>

      <label class="remember"><input type="checkbox"> Remember me</label>

      <a class="btn-login" href="dashboard.html">LOG IN</a>
    </form>

    <p class="signup-line">Don't have an account? <a href="#signup" id="goSignup">Sign Up</a></p>
  </div>

  <div class="auth-panel" id="signup">
    <form action="onboarding.html" method="get">
      <label class="field-label" for="suName">Full Name</label>
      <div class="input-wrap">
        <input type="text" id="suName" placeholder="Enter your full name">
      </div>

      <label class="field-label" for="suEmail">Email Address</label>
      <div class="input-wrap">
        <input type="email" id="suEmail" placeholder="Enter your email">
      </div>

      <label class="field-label" for="suPassword">Password</label>
      <div class="input-wrap">
        <input type="password" id="suPassword" placeholder="Create a password">
        <svg class="eye" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9AA1A8" stroke-width="1.9"><path d="M3 12s3.5-6 9-6c2 0 3.7.8 5.1 1.9M21 12s-3.5 6-9 6c-2 0-3.7-.8-5.1-1.9"/><path d="M4 4l16 16"/></svg>
      </div>

      <a class="btn-login" href="onboarding.html">CREATE ACCOUNT</a>
    </form>

    <p class="signup-line">Already have an account? <a href="#login" id="goLogin">Log In</a></p>
  </div>

  <a class="home-link" href="index.html">Back to Home</a>
</div>

<script>
  // Log In / Sign Up tab switching (both panels stay readable when JS is off)
  (function(){
    var tabLogin = document.getElementById('tabLogin');
    var tabSignup = document.getElementById('tabSignup');
    var panelLogin = document.getElementById('login');
    var panelSignup = document.getElementById('signup');
    function show(which){
      var login = (which === 'login');
      tabLogin.classList.toggle('active', login);
      tabSignup.classList.toggle('active', !login);
      panelLogin.classList.toggle('on', login);
      panelSignup.classList.toggle('on', !login);
    }
    tabLogin.addEventListener('click', function(e){ e.preventDefault(); show('login'); });
    tabSignup.addEventListener('click', function(e){ e.preventDefault(); show('signup'); });
    document.getElementById('goSignup').addEventListener('click', function(e){ e.preventDefault(); show('signup'); });
    document.getElementById('goLogin').addEventListener('click', function(e){ e.preventDefault(); show('login'); });
    if (window.location.hash === '#signup') show('signup');
  })();
</script>

<script>
  // Scroll reveal: IntersectionObserver plus a hard 1.5s failsafe so nothing can ever stay hidden
  (function(){
    var els = document.querySelectorAll('.rv');
    if (!els.length) return;
    function all(){ els.forEach(function(el){ el.classList.add('in'); }); }
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function(es){
        es.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
      }, { threshold:.1, rootMargin:'0px 0px -30px 0px' });
      els.forEach(function(el){ io.observe(el); });
    } else { all(); }
    setTimeout(all, 1500);
  })();
</script>
</body>
</html>
