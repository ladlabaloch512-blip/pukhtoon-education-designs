<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Pukhtoon Education</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>

*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0B0B0D;--bg2:#101013;--panel:#141418;--card:#18181D;--card2:#1E1E24;--border:#28282F;--red:#E2231A;--red2:#F0441F;--txt:#FFFFFF;--mut:#A7A7B0;--mut2:#7C7C86;--gold:#F6A21E;--green:#2FA84F}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
img{max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.logo-chip{display:inline-flex;align-items:center;background:#fff;border-radius:10px;padding:5px 9px;line-height:0}
.logo-chip img{height:52px;width:auto;display:block}
.logo-chip.sm img{height:42px}
.btn{display:inline-block;background:var(--red);color:#fff;font-weight:700;border:2px solid var(--red);border-radius:9px;padding:12px 26px;font-size:16px;cursor:pointer;text-align:center;transition:transform .3s ease,background .3s ease,border-color .3s ease,box-shadow .3s ease}
.btn:hover{background:#c71d15;border-color:#c71d15;transform:translateY(-2px);box-shadow:0 10px 24px rgba(226,35,26,.28)}
.btn.ghost{background:transparent;color:#fff;border-color:#4A4A52}
.btn.ghost:hover{border-color:#fff;background:transparent}
.btn.redtext{background:transparent;color:var(--red)}
.btn.redtext:hover{background:rgba(226,35,26,.08)}
header.site{position:sticky;top:0;z-index:50;background:rgba(13,13,16,.97);border-bottom:1px solid #1E1E23}
.hbar{display:flex;align-items:center;gap:28px;padding:14px 0}
nav.main{display:flex;gap:30px;margin-left:auto;align-items:center}
nav.main a{font-size:16.5px;color:#EDEDF0;padding:6px 2px;border-bottom:3px solid transparent}
nav.main a.active{color:var(--red);border-bottom-color:var(--red)}
nav.main a:hover{color:var(--red)}
.hbtns{display:flex;gap:12px;align-items:center;margin-left:8px}
.hbtns .btn{padding:10px 22px;font-size:15.5px}
#menu-toggle{position:absolute;opacity:0;pointer-events:none}
.burger{display:none;margin-left:auto;cursor:pointer;padding:10px}
.burger span{display:block;width:26px;height:3px;background:#fff;margin:5px 0;border-radius:2px}
.sec{padding:64px 0 8px}
.sec-title{font-size:27px;font-weight:800;letter-spacing:.4px;margin-bottom:14px;text-transform:uppercase}
.sec-sub{color:var(--mut);font-size:16.5px;max-width:720px;margin-bottom:28px}
footer.site{margin-top:70px;background:#0E0E11;border-top:1px solid #1E1E23;padding:44px 0 34px}
.foot-grid{display:grid;grid-template-columns:1.2fr 1fr 1.3fr;gap:34px;align-items:start}
footer.site h4{color:var(--red);font-size:19px;margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
footer.site li{list-style:none;color:#D8D8DE;margin-bottom:9px;font-size:15.5px}
footer.site a:hover{color:var(--red)}
.copy{text-align:center;color:var(--mut2);font-size:14px;padding:18px 0 4px}
.avatar{width:44px;height:44px;border-radius:50%;background:#3A3A42;border:2px solid #55555F;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex:none}
.bell{width:44px;height:44px;border-radius:11px;background:var(--red);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
.bell i{position:absolute;top:-4px;right:-4px;width:13px;height:13px;background:#FF5A1F;border-radius:50%;border:2px solid #0D0D10}
.progress{height:13px;background:#33333B;border-radius:8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--red);border-radius:8px;transform-origin:left center;animation:barGrow 1.3s ease .15s both}
.tag{display:inline-block;font-weight:800;font-size:12.5px;padding:4px 11px;border-radius:6px;letter-spacing:.4px}
.tag.free{background:#111;color:#fff;border:1px solid #444}
.tag.paid{background:var(--red);color:#fff}
@keyframes rise{from{opacity:.85;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:rise .7s ease both}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}.d4{animation-delay:.26s}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 1px rgba(226,35,26,.35),0 24px 60px rgba(0,0,0,.55)}50%{box-shadow:0 0 0 2px rgba(226,35,26,.8),0 0 38px rgba(226,35,26,.38),0 24px 60px rgba(0,0,0,.55)}}
.pulse{animation:pulseGlow 3.2s ease-in-out infinite}
.lift{transition:transform .35s ease,box-shadow .35s ease,border-color .35s ease}
.lift:hover{transform:translateY(-5px);border-color:rgba(226,35,26,.6);box-shadow:0 16px 36px rgba(0,0,0,.5),0 0 24px rgba(226,35,26,.16)}
.marquee{background:#101013;border-top:1px solid #1E1E23;border-bottom:1px solid #1E1E23;overflow:hidden;padding:13px 0;margin-top:26px}
.mtrack{display:flex;width:max-content;animation:marquee 30s linear infinite}
.mtrack span{font-weight:800;letter-spacing:1.6px;font-size:14.5px;color:#C9C9D1;padding:0 18px;white-space:nowrap}
.mtrack b{color:var(--red)}
details.faq{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
details.faq summary{cursor:pointer;padding:19px 22px;font-size:17px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";color:var(--red);font-size:24px;font-weight:800;line-height:1;flex:none}
details.faq[open ] summary::after{content:"-"}
details.faq .fans{padding:0 22px 20px;color:var(--mut);font-size:15.5px;line-height:1.65;animation:rise .45s ease both}
@media(max-width:900px){
 .burger{display:block}
 nav.main{position:absolute;top:100%;left:0;right:0;background:#111114;flex-direction:column;align-items:stretch;gap:0;padding:8px 24px 16px;display:none;border-bottom:1px solid #26262C}
 nav.main a{padding:12px 2px;border-bottom:1px solid #222228}
 #menu-toggle:checked ~ nav.main{display:flex}
 .hbtns{display:none}
 nav.main .hbtns{display:flex;margin:12px 0 4px}
 .foot-grid{grid-template-columns:1fr}
}

body{background:#0D0D10}
.authwrap{max-width:1060px;margin:0 auto;padding:44px 24px 30px}
.authlabels{display:grid;grid-template-columns:1fr 1fr;gap:36px;color:#8E8E96;font-weight:700;letter-spacing:1.5px;font-size:14.5px;margin-bottom:12px}
.authgrid{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.authcard{background:#101013;border:1px solid #222228;border-radius:22px;padding:42px 42px 36px}
.authcard .logobox{background:#fff;border-radius:16px;padding:18px 10px;text-align:center;margin-bottom:30px}
.authcard .logobox img{height:150px;width:auto}
.authcard h2{font-size:29px;margin-bottom:7px}
.authcard .sub{color:#C9C9D1;margin-bottom:26px;font-size:16px}
.field{display:flex;align-items:center;gap:12px;background:#26262C;border:1.5px solid #3A3A42;border-radius:11px;padding:0 16px;margin-bottom:18px}
.field:focus-within{border-color:#C9C9D1}
.field input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:16.5px;padding:15px 0;font-family:inherit;min-width:0}
.field input::placeholder{color:#9A9AA3}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 24px;font-size:15px;flex-wrap:wrap}
.frow a{color:var(--red2);font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:#D8D8DE;margin:2px 0 24px}
.check input{width:19px;height:19px;margin-top:2px;accent-color:var(--red)}
.check a{color:var(--red2);font-weight:700}
.authcard .btn{width:100%;font-size:18.5px;padding:16px;letter-spacing:.6px;box-shadow:0 10px 30px rgba(226,35,26,.35)}
.switch{text-align:center;margin-top:28px;color:#D8D8DE;font-size:15.5px}
.switch a{color:var(--red2);font-weight:800}
.backlink{display:inline-block;margin-bottom:22px;color:var(--mut);font-size:15.5px}
.backlink:hover{color:#fff}
@media(max-width:820px){.authgrid{grid-template-columns:1fr}.authlabels{display:none}.authcard{padding:32px 24px 28px}}

</style>
</head>
<body>
<main class="authwrap">
<a class="backlink" href="index.html">&#8592; Back to Home</a>
<div class="authlabels"><span>LOGIN</span><span>SIGN UP</span></div>
<div class="authgrid">
<form class="authcard anim" action="dashboard.html" method="get">
<div class="logobox"><img src="logo.jpg" alt="Pukhtoon Education logo"></div>
<h2>Login</h2><p class="sub">Welcome back! Please log in to your account.</p>
<label class="field"><svg width="20" height="20" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" fill="#9A9AA3"/><path d="M3 7l9 6 9-6" stroke="#26262C" stroke-width="2" fill="none"/></svg><input type="text" placeholder="Email or Username"></label>
<label class="field"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9.5" rx="2" fill="#9A9AA3"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" stroke="#9A9AA3" stroke-width="2.2"/></svg><input type="password" placeholder="Password" value="........"></label>
<div class="frow"><label style="display:flex;gap:9px;align-items:center"><input type="checkbox" style="width:18px;height:18px;accent-color:var(--red)"> Remember me</label><a href="login.html">Forgot Password?</a></div>
<button class="btn" type="submit">LOG IN</button>
<p class="switch">Don't have an account? <a href="login.html">Sign Up</a></p>
</form>
<form class="authcard anim d2" action="dashboard.html" method="get">
<div class="logobox"><img src="logo.jpg" alt="Pukhtoon Education logo"></div>
<h2>Sign Up</h2><p class="sub">Create a new account to get started.</p>
<label class="field"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" fill="#9A9AA3"/><path d="M4 20c1.5-3.6 4.5-5 8-5s6.5 1.4 8 5" fill="#9A9AA3"/></svg><input type="text" placeholder="Full Name"></label>
<label class="field"><svg width="20" height="20" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" fill="#9A9AA3"/><path d="M3 7l9 6 9-6" stroke="#26262C" stroke-width="2" fill="none"/></svg><input type="email" placeholder="Email Address"></label>
<label class="field"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9.5" rx="2" fill="#9A9AA3"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" stroke="#9A9AA3" stroke-width="2.2"/></svg><input type="password" placeholder="Password"></label>
<label class="field"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9.5" rx="2" fill="#9A9AA3"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" stroke="#9A9AA3" stroke-width="2.2"/></svg><input type="password" placeholder="Confirm Password"></label>
<label class="check"><input type="checkbox"> <span>I agree to the <a href="index.html#how">Terms &amp; Conditions</a></span></label>
<button class="btn" type="submit">CREATE ACCOUNT</button>
<p class="switch">Already have an account? <a href="login.html">Log In</a></p>
</form>
</div>
<p class="copy" style="padding-top:30px">&copy; 2024 Pukhtoon Education. All Rights Reserved.</p></main>
</body></html>
